<div class="overlay" id="palette" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palInput" autocomplete="off" spellcheck="false" placeholder="Type a command or view…" aria-label="Command">
    <ul id="palList" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>⏎</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div class="overlay" id="keys" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
    <h2>Keyboard shortcuts</h2>
    <div class="cols2">
      <dl id="keysGlobal"></dl>
      <dl id="keysView"></dl>
    </div>
    <p class="who">Press <kbd>?</kbd> anytime. <kbd>Esc</kbd> closes.</p>
  </div>
</div>
