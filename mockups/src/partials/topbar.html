<div class="bar">
  <div class="brand">/*ICON:spall*/ spall <small>shop.example.test</small></div>
  <div class="live"><span class="dot"></span>LIVE</div>
  <div class="meter"><span class="segs" id="segs"></span><b id="rate">0.0</b> req/s</div>
  <div class="spacer"></div>
  <button class="estop" id="estop" title="Halt all agent tasks (Shift+Esc)"><i></i><span id="estopLabel">STOP AGENT</span></button>
  <div class="seg" role="group" aria-label="Metal">
    <button data-metal="rust" aria-pressed="true"><span class="sw sw-rust"></span>Rust</button>
    <button data-metal="blued" aria-pressed="false"><span class="sw sw-blued"></span>Blued</button>
  </div>
  <div class="seg" role="group" aria-label="Brightness" title="t toggles">
    <button data-mode="dark" aria-pressed="true"><span aria-hidden="true">◐</span>Dark</button>
    <button data-mode="light" aria-pressed="false"><span aria-hidden="true">○</span>Light</button>
  </div>
  <div class="launch" id="launch">
    <button aria-label="Switch tool" id="launchBtn"><span class="grid9"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
    <div class="panel">
      <a class="tile here" href="#"><span class="led up"></span>/*ICON:spall*/spall</a>
      <a class="tile" href="#"><span class="led up"></span>/*ICON:kudzu*/kudzu</a>
      <a class="tile" href="#"><span class="led"></span>/*ICON:scurf*/scurf</a>
      <span class="tile headless" title="headless: status only"><span class="led up"></span>/*ICON:taphttp*/taphttp</span>
      <span class="tile headless" title="library: no service"><span class="led"></span>/*ICON:flux*/flux</span>
    </div>
  </div>
</div>
